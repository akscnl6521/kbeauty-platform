name: Core Journey CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Core journey self-tests
        run: |
          npm run test:symptom-safety
          npm run test:analyze-safety
          npm run test:concern-observations
          npm run test:result-exposure
          npm run test:care-auto-save
          npm run test:care-referral

      - name: Existing regression tests
        run: |
          npm run test:pipeline
          npm run test:journey
          npm run test:smoke

      - name: Build
        run: npm run build
