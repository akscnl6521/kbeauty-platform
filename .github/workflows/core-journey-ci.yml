name: Core Journey CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `main...HEAD` 비교가 필요해서 전체 히스토리를 받는다 (캐시 버전 관문).
          # 얕은 클론이면 기준을 못 찾아 관문이 조용히 통과된다.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Core journey self-tests
        run: |
          npm run test:symptom-safety
          npm run test:analyze-safety
          npm run test:concern-observations
          npm run test:concern-form-state
          npm run test:analyze-concern-payload
          npm run test:analyze-concern-patcher
          npm run test:analyze-integration-build
          npm run test:result-exposure
          npm run test:care-auto-save
          npm run test:care-referral
          npm run test:care-dashboard
          npm run test:care-guidance
          npm run test:reminder-delivery
          npm run test:check-in-questions
          npm run test:care-data
          npm run test:product-feedback
          npm run test:feedback-summary
          npm run test:catalog-refresh
          npm run test:catalog-refresh-due
          npm run test:collection-decision
          npm run test:staging-sync-plan
          npm run test:usage-media
          npx --yes tsx scripts/usage-media-review-queue-selftest.ts
          npx --yes tsx scripts/usage-media-review-artifact-selftest.ts
          npm run test:usage-guide-display
          npm run test:usage-media-organic
          npx --yes tsx scripts/routine-usage-guide-display-selftest.ts
          npm run test:clinic-referral
          npm run test:clinic-refresh
          npm run test:clinic-sync
          npm run test:clinic-staging-sync
          npm run test:clinic-plan-audit
          npm run test:clinic-apply-guard
          npm run test:clinic-apply-manifest
          npm run test:clinic-execution-policy
          npm run test:clinic-review-queue
          npm run test:clinic-plan-artifact
          npm run test:commercial-separation
          npm run test:catalog-exception-artifact
          npm run test:enrichment-portability
          npx --yes tsx scripts/automation-integrity-audit-selftest.ts
          npx --yes tsx scripts/unified-review-manifest-selftest.ts
          npx --yes tsx scripts/admin-unified-review-screen-selftest.ts
          npx --yes tsx scripts/admin-review-api-selftest.ts
      - name: Customer journey regression
        run: npm run test:journey
      - name: Recommendation cache invalidation
        # 2026-08-04 — 배포는 됐는데 사용자 화면이 안 바뀐 사고. offer/랭킹 로직을
        # 바꾸면 RECOMMENDATION_CACHE_VERSION 을 올려야 옛 Top 5 가 폐기된다.
        # 주석으로만 적어 뒀더니 잊었다. 여기서 막는다.
        run: |
          npm run test:cache-version-guard
          npm run test:recommendation-cache-version
      - name: Cache version bump check
        # main 대비 캐시 영향 파일이 바뀌었는데 버전을 안 올렸으면 실패한다.
        # 얕은 클론이면 기준을 못 찾아 통과시키므로 fetch-depth 0 이 필요하다.
        run: npm run check:cache-version-bump
      - name: Apply analyze concern integration patch
        run: npm run patch:analyze-concerns
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-ci-build-only
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-build-log
          path: build.log
          retention-days: 1

  legacy-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - pipeline
          - journey
          - recommend-score
          - localization
          - quality-regression
          - redness
          - analyze-input
          - analyze-reference
          - catalog-audit
          - catalog-automation
          - scalp-hair
          - beauty-catalog
          - product-create
    name: legacy-${{ matrix.suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run isolated suite
        run: npx --yes tsx scripts/pipeline-diagnostic-selftest.ts ${{ matrix.suite }} 2>&1 | tee diagnostic.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ matrix.suite }}
          path: diagnostic.log
          retention-days: 1
