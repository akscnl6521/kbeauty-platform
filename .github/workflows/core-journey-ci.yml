name: Core Journey CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Core journey self-tests
        run: |
          npm run test:symptom-safety
          npm run test:analyze-safety
          npm run test:concern-observations
          npm run test:result-exposure
          npm run test:care-auto-save
          npm run test:care-referral
      - name: Customer journey regression
        run: npm run test:journey
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-build-log
          path: build.log
          retention-days: 1

  legacy-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - pipeline
          - journey
          - recommend-score
          - localization
          - quality-regression
          - redness
          - analyze-input
          - analyze-reference
          - catalog-audit
          - catalog-automation
          - scalp-hair
          - beauty-catalog
          - product-create
    name: legacy-${{ matrix.suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run isolated suite
        run: npx --yes tsx scripts/pipeline-diagnostic-selftest.ts ${{ matrix.suite }} 2>&1 | tee diagnostic.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ matrix.suite }}
          path: diagnostic.log
          retention-days: 1
