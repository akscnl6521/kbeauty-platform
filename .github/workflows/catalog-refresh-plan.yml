name: Catalog Refresh Plan

on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate refresh policy
        run: npm run test:catalog-refresh
      - name: Build refresh plan
        run: npm run catalog:refresh-plan
      - name: Upload refresh plan
        uses: actions/upload-artifact@v4
        with:
          name: catalog-refresh-plan
          path: data/catalog/refresh-plans/*.json
          retention-days: 14
