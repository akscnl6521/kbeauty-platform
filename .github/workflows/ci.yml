name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public placeholders so Next build can compile without real secrets
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-ci-build-only

  migration-files:
    name: Check migration files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure migrations exist
        run: |
          test -d supabase/migrations
          count=$(find supabase/migrations -name '*.sql' | wc -l)
          echo "migration_count=$count"
          test "$count" -ge 1

      - name: Find unsupported CREATE OR REPLACE POLICY
        id: policy_check
        shell: bash
        run: |
          set +e
          grep -RIn --include='*.sql' 'CREATE OR REPLACE POLICY' supabase/migrations | tee migration-policy-diagnostic.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "PostgreSQL does not support CREATE OR REPLACE POLICY"
            exit 1
          fi
          echo "OK: no CREATE OR REPLACE POLICY"

      - name: Upload migration diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-policy-diagnostic
          path: migration-policy-diagnostic.log
          if-no-files-found: ignore
          retention-days: 1
