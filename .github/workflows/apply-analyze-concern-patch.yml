name: Apply Analyze Concern Patch

on:
  push:
    branches:
      - docs/master-plan-v4.1-20260718
    paths:
      - "scripts/patch-analyze-concern-observations.ts"
      - ".github/workflows/apply-analyze-concern-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/master-plan-v4.1-20260718
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply guarded analyze patch
        run: npm run patch:analyze-concerns
      - name: Verify concern payload and patcher
        run: |
          npm run test:analyze-concern-payload
          npm run test:analyze-concern-patcher
      - name: Build patched application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-ci-build-only
        run: npm run build
      - name: Commit patched analyze page
        run: |
          if git diff --quiet -- src/app/analyze/page.tsx; then
            echo "No analyze page changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/analyze/page.tsx
          git commit -m "feat(analyze): connect concern observation panel"
          git push origin HEAD:docs/master-plan-v4.1-20260718
